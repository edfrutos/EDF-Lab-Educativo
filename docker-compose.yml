# EDF Lab Educativo — stack Compose (API + dashboard)
# Arrancar desde la raíz del repo: docker compose up --build

services:
  # API Express con SQLite (reutiliza api/Dockerfile)
  edf-lab-api:
    build: ./api
    ports:
      - "3100:3100"
    # Bind mount: la carpeta api/data del host se comparte con el contenedor.
    # users.db escrito dentro del contenedor aparece en api/data/users.db del host.
    volumes:
      - ./api/data:/usr/src/app/data

  # Dashboard estático servido por nginx (sin volumen — solo ficheros estáticos)
  edf-lab-dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    depends_on:
      - edf-lab-api
