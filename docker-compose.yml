# EDF Lab Educativo — stack Compose (API + dashboard + PostgreSQL)
# Arrancar desde la raíz del repo: docker compose up --build
#
# PostgreSQL usa un volumen nombrado (postgres_data): los datos sobreviven a
# docker compose down. SQLite en host-dev sigue usando bind mount en api/data.
# DATABASE_URL en edf-lab-api selecciona Postgres dentro del contenedor.
# Credenciales ficticias de laboratorio — no usar en producción.

services:
  # PostgreSQL 16 — base de datos cliente-servidor del laboratorio
  edf-lab-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edf_lab
      POSTGRES_PASSWORD: edf_lab_dev
      POSTGRES_DB: edf_lab
    volumes:
      # Volumen nombrado: persiste datos aunque se destruya el contenedor
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Publicado para aprender con psql desde el host
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edf_lab -d edf_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Express — usa PostgreSQL vía DATABASE_URL cuando corre en Compose
  edf-lab-api:
    build: ./api
    # Crear api/.env desde api/.env.example antes de compose up (secretos fuera del YAML)
    env_file:
      - ./api/.env
    ports:
      - "3100:3100"
    # Bind mount: la carpeta api/data del host se comparte con el contenedor.
    # users.json sigue disponible; SQLite no se usa cuando DATABASE_URL está definida.
    volumes:
      - ./api/data:/usr/src/app/data
    depends_on:
      edf-lab-postgres:
        condition: service_healthy

  # Dashboard estático servido por nginx (sin volumen — solo ficheros estáticos)
  edf-lab-dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    depends_on:
      - edf-lab-api

  # Edge proxy TLS — solo perfil prod (único puerto :443 en host)
  edf-lab-proxy:
    build: ./proxy
    profiles:
      - prod
    ports:
      # Si :443 está ocupado en el host: PROD_HTTPS_PORT=8443 en .env (raíz del repo)
      - "${PROD_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - edf-lab-api
      - edf-lab-dashboard

volumes:
  postgres_data:
